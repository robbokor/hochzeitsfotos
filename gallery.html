<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unsere Hochzeit – Galerie</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest-guest.webmanifest" />
<link rel="apple-touch-icon" href="icons/guest-180.png" />
<link rel="icon" href="icons/guest-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Hochzeitsfotos" />
<meta name="theme-color" content="#b98a6a" />
<style>
  .wrap { max-width: 720px; }
  #gallery-grid { column-count: 2; column-gap: 14px; }
  @media (min-width: 480px) { #gallery-grid { column-count: 3; } }
  .photo-card {
    display: block;
    break-inside: avoid;
    margin-bottom: 14px;
    background: #fff;
    padding: 6px 6px 10px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
    transform: rotate(var(--tilt, 0deg));
    transition: transform 0.15s ease;
  }
  .photo-card:active { transform: rotate(var(--tilt, 0deg)) scale(0.97); }
  .photo-card img { width: 100%; height: auto; display: block; border-radius: 3px; }
  .photo-card .challenge-caption {
    display: block;
    font-size: 0.75rem;
    color: var(--accent-dark) !important;
    text-decoration: none !important;
    font-weight: 600;
    padding: 6px 2px 0;
    line-height: 1.3;
  }
  .back-link { display: block; text-align: center; margin-bottom: 16px; color: var(--accent-dark); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>📸 Unsere Hochzeit</h1>
    <p>Alle Fotos, die Gäste geteilt haben.</p>
  </header>

  <a href="index.html" class="back-link">← Selbst Fotos hochladen</a>

  <p id="gallery-status" style="color:var(--muted); text-align:center;"></p>
  <div id="gallery-grid"></div>

  <footer>Bitte mit Respekt behandeln – das sind private Erinnerungen von euren Liebsten.</footer>
</div>

<script type="module" src="js/gallery.js"></script>
</body>
</html>
